name: CI

# The same checks deploy.yml runs before deploying, on every pull request, so
# a change that would fail the deploy fails its PR first.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
